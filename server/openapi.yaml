openapi: 3.0.3
info:
  title: Deep Catch — Mock Game Server
  version: 0.0.0
  description: >
    Development game server. Server-authoritative for sessions, balances, RNG,
    outcomes and payouts. Only the endpoints implemented at the current milestone
    are listed here.
servers:
  - url: http://127.0.0.1:3001

tags:
  - name: health
  - name: session
  - name: game
  - name: seed
  - name: operator
  - name: debug

paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number, example: 12.34 }

  /api/session:
    post:
      tags: [session]
      summary: Create a session (unauthenticated)
      description: >
        Performs a real HMAC-SHA256-signed round-trip to POST /operator/launch,
        then mints a session token bound to a fresh development wallet.
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, playerId, currency, balance]
                properties:
                  sessionToken: { type: string, format: uuid }
                  playerId: { type: string, example: dev-player-1 }
                  currency: { type: string, example: USD }
                  balance:
                    type: string
                    description: Decimal string, never a float.
                    example: "1000.00"
        "502":
          $ref: "#/components/responses/Error"

  /api/session/refresh:
    post:
      tags: [session]
      summary: Rotate the session token
      description: >
        Each token refreshes at most once — the old token is invalidated
        immediately, not given a grace period.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New session token
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, playerId, currency, balance]
                properties:
                  sessionToken: { type: string, format: uuid }
                  playerId: { type: string, example: dev-player-1 }
                  currency: { type: string, example: USD }
                  balance: { type: string, example: "1000.00" }
        "401":
          $ref: "#/components/responses/Error"

  /api/game/balance:
    get:
      tags: [game]
      summary: Authoritative live balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency]
                properties:
                  balance: { type: string, example: "1000.00" }
                  currency: { type: string, example: USD }
        "401":
          $ref: "#/components/responses/Error"

  /api/game/current:
    post:
      tags: [game]
      summary: Balance plus any in-progress round to resume
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency, active]
                properties:
                  balance: { type: string, example: "1000.00" }
                  currency: { type: string, example: USD }
                  active:
                    type: boolean
                    description: True when a round is open and resumable.
                  roundId: { type: string }
                  bets:
                    type: array
                    description: >
                      The open round's bets — present only when active.
                      Outcome/payout are deliberately withheld here; call
                      GET /api/game/round/{id} for the full result to
                      resume presentation from.
                    items: { $ref: "#/components/schemas/Bet" }
        "401":
          $ref: "#/components/responses/Error"

  /api/game/play:
    post:
      tags: [game]
      summary: The single game-action envelope — start a round or complete one
      description: >
        message must contain exactly one of start|complete. start places
        bets and opens the round (the outcome is generated now, and the
        wager is debited immediately). complete settles an open round (the
        payout is credited now).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  oneOf:
                    - type: object
                      required: [start]
                      properties:
                        start:
                          type: object
                          required: [bets]
                          properties:
                            bets:
                              type: array
                              items: { $ref: "#/components/schemas/Bet" }
                    - type: object
                      required: [complete]
                      properties:
                        complete:
                          type: object
                          required: [roundId]
                          properties:
                            roundId: { type: string }
      responses:
        "200":
          description: Round result
          content:
            application/json:
              schema:
                type: object
                required: [message, roundId]
                properties:
                  message: { $ref: "#/components/schemas/RoundResult" }
                  roundId: { type: string }
        "400":
          $ref: "#/components/responses/Error" # invalid_message | invalid_bet | insufficient_balance
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error" # round_not_found
        "409":
          $ref: "#/components/responses/Error" # round_already_started | round_already_completed

  /api/game/round/{id}:
    get:
      tags: [game]
      summary: Full detail for one round
      description: >
        Always full detail, regardless of status — unlike
        POST /api/game/current, an open round is not redacted here.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Round detail
          content:
            application/json:
              schema:
                type: object
                required: [roundId, status, outcome, bets, payout, seed]
                properties:
                  roundId: { type: string }
                  status: { type: string, enum: [open, completed] }
                  outcome: { $ref: "#/components/schemas/FishingOutcome" }
                  bets:
                    type: array
                    items: { $ref: "#/components/schemas/BetResult" }
                  payout: { $ref: "#/components/schemas/PayoutResult" }
                  seed: { $ref: "#/components/schemas/RoundSeed" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/game/verify:
    post:
      tags: [game]
      summary: Recompute a past outcome from its seed triple (provably fair)
      description: >
        Stateless. Supply the revealed serverSeed (from POST /api/seed/reveal)
        plus the clientSeed and nonce recorded with the round, and compare the
        returned outcome to what that round paid out. Same inputs always yield
        the same outcome — that is the proof. Rounds pinned with a forced
        outcome (dev only) will not match by design.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverSeed, clientSeed, nonce]
              properties:
                serverSeed: { type: string }
                clientSeed: { type: string }
                nonce: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Recomputed outcome
          content:
            application/json:
              schema:
                type: object
                required: [serverSeedHash, clientSeed, nonce, outcome]
                properties:
                  serverSeedHash: { type: string, description: SHA-256 of the supplied serverSeed. }
                  clientSeed: { type: string }
                  nonce: { type: integer }
                  outcome: { $ref: "#/components/schemas/FishingOutcome" }
        "400":
          $ref: "#/components/responses/Error" # invalid_verify_request
        "401":
          $ref: "#/components/responses/Error"

  /api/game/history:
    get:
      tags: [game]
      summary: Recent completed rounds, newest first
      description: Full list, no pagination at this milestone.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Round history
          content:
            application/json:
              schema:
                type: object
                required: [rounds]
                properties:
                  rounds:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEntry" }
        "401":
          $ref: "#/components/responses/Error"

  /api/seed/current:
    post:
      tags: [seed]
      summary: Active seed context
      description: Hashed server seed, current client seed, and the nonce the next round will use.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current seed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedContext" }
        "401":
          $ref: "#/components/responses/Error"

  /api/seed/upcoming:
    post:
      tags: [seed]
      summary: Hash of the next server seed
      description: >
        Committed now, becomes the active server seed after the next rotate.
        Lets the player pin the commitment before it is in play.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Next server seed commitment
          content:
            application/json:
              schema:
                type: object
                required: [serverSeedHash]
                properties:
                  serverSeedHash: { type: string }
        "401":
          $ref: "#/components/responses/Error"

  /api/seed/rotate:
    post:
      tags: [seed]
      summary: Rotate to the next server seed
      description: >
        Moves the current server seed into the revealed list, switches to the
        pre-committed next one, and resets the nonce to 0. An optional new
        client seed can be supplied; otherwise a fresh random one is generated.
        Rejected while a round is open.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientSeed: { type: string, maxLength: 256 }
      responses:
        "200":
          description: New seed context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedContext" }
        "400":
          $ref: "#/components/responses/Error" # invalid_seed_request
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error" # round_in_progress

  /api/seed/reveal:
    post:
      tags: [seed]
      summary: Reveal the most recently rotated-away seed pair
      description: >
        Returns the previous server seed in full, with its hash, client seed
        and final nonce, so every outcome rolled under it can be re-derived
        via POST /api/game/verify.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revealed seed pair
          content:
            application/json:
              schema:
                type: object
                required: [serverSeed, serverSeedHash, clientSeed, nonce]
                properties:
                  serverSeed: { type: string }
                  serverSeedHash: { type: string }
                  clientSeed: { type: string }
                  nonce: { type: integer }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error" # nothing_to_reveal

  /api/debug/state:
    get:
      tags: [debug]
      summary: Current debug overrides
      description: >
        Development only — this route (and every /api/debug/* route) is not
        registered when NODE_ENV=production. Unauthenticated by design: the
        client gates these behind VITE_DEBUG, not the bearer token.
      responses:
        "200":
          description: Debug state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugState" }

  /api/debug/force-outcome:
    post:
      tags: [debug]
      summary: Pin the next round's outcome (dev only)
      description: >
        Any provided field is forced; omit a field to leave it rolled. An empty
        body clears the override. "Force Kraken" is just
        { depth: trench, fish: kraken, tier: jackpot }.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                depth: { type: string, enum: [shallow, reef, deep, abyss, trench] }
                fish: { type: string, example: kraken }
                tier: { type: string, enum: [small, large, epic, legendary, jackpot] }
      responses:
        "200":
          description: Updated debug state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugState" }
        "400":
          $ref: "#/components/responses/Error" # invalid_debug_request

  /api/debug/simulate:
    post:
      tags: [debug]
      summary: Arm simulated latency / errors (dev only)
      description: >
        Only the provided fields change. Applies to every non-debug request;
        /api/debug/* itself is exempt so the controls stay reachable.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latencyMs: { type: number, minimum: 0, example: 250 }
                errorRate:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Probability each request fails with a simulated 500.
      responses:
        "200":
          description: Updated debug state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugState" }
        "400":
          $ref: "#/components/responses/Error" # invalid_debug_request

  /api/debug/reset-balance:
    post:
      tags: [debug]
      summary: Reset every dev wallet (dev only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: string
                  description: Decimal string. Defaults to the configured starting balance.
                  example: "1000.00"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          $ref: "#/components/responses/Error" # invalid_debug_request

  /api/debug/reset-session:
    post:
      tags: [debug]
      summary: Drop every session + round (dev only)
      description: >
        Every token goes dead; the client's next call 401s and it re-launches.
        Also clears any forced outcome and simulation settings.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /operator/launch:
    post:
      tags: [operator]
      summary: Operator side of the launch handshake (internal)
      description: >
        Called by POST /api/session over real HTTP. Requires the X-Operator-ID,
        X-Timestamp and X-HMAC-SHA256 headers. Not called directly by the client.
      parameters:
        - in: header
          name: X-Operator-ID
          required: true
          schema: { type: string }
        - in: header
          name: X-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: X-HMAC-SHA256
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        "200":
          description: Launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId: { type: string }
                  launched: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"

components:
  schemas:
    Bet:
      type: object
      required: [type, selection, amount]
      properties:
        type: { type: string, enum: [depth, fish] }
        selection:
          type: string
          description: >
            A depth id (shallow|reef|deep|abyss|trench) for a `depth` bet, or a
            fish id from the server roster (server/src/constants.ts) for a `fish`
            bet. Any other value is rejected as invalid_bet.
          example: shallow
        amount:
          type: string
          description: >
            Decimal string, never a float. Must be within the server's per-bet
            stake limits (dev defaults 0.10–500.00, DEV_MIN_BET / DEV_MAX_BET);
            outside that range is rejected as invalid_bet.
          example: "10.00"
    FishingOutcome:
      type: object
      required: [depth, fish, tier]
      properties:
        depth: { type: string, enum: [shallow, reef, deep, abyss, trench] }
        fish:
          type: string
          description: >
            A fish id from the server roster (server/src/constants.ts, mirrors
            docs/GDD.md). Always belongs to `depth`; `tier` is that fish's
            roster tier, not an independent roll.
          example: shark
        tier: { type: string, enum: [small, large, epic, legendary, jackpot] }
    BetResult:
      allOf:
        - $ref: "#/components/schemas/Bet"
        - type: object
          required: [won, multiplier, payout]
          properties:
            won: { type: boolean }
            multiplier:
              type: string
              description: >
                The selection's fixed table multiplier (depth bets from
                DEPTH_MULTIPLIERS, fish bets from the roster). Reported even when
                the bet lost — it is what the bet would have paid.
              example: "28.00"
            payout:
              type: string
              description: amount × multiplier on a win; zero (emitted, not omitted) on a loss.
              example: "0.00"
    PayoutResult:
      type: object
      required: [total, wagered, net]
      properties:
        total:
          type: string
          description: Sum of winning bets' payouts — what complete credits to balance.
          example: "280.00"
        wagered:
          type: string
          description: Sum of bet amounts — what start already debited.
          example: "10.00"
        net:
          type: string
          description: total − wagered; negative (leading "-") on a losing round.
          example: "270.00"
    RoundResult:
      type: object
      required: [roundId, outcome, bets, payout, metadata]
      properties:
        roundId: { type: string }
        outcome: { $ref: "#/components/schemas/FishingOutcome" }
        bets:
          type: array
          items: { $ref: "#/components/schemas/BetResult" }
        payout: { $ref: "#/components/schemas/PayoutResult" }
        metadata:
          type: object
          description: >
            balance is always "0" here — NOT authoritative. Read balance
            from GET /api/game/balance, or track it locally.
          required: [balance]
          properties:
            balance: { type: string, example: "0" }
    HistoryEntry:
      type: object
      required: [roundId, outcome, bets, payout, seed, completedAt]
      properties:
        roundId: { type: string }
        outcome: { $ref: "#/components/schemas/FishingOutcome" }
        bets:
          type: array
          items: { $ref: "#/components/schemas/BetResult" }
        payout: { $ref: "#/components/schemas/PayoutResult" }
        seed: { $ref: "#/components/schemas/RoundSeed" }
        completedAt: { type: string, format: date-time }
    RoundSeed:
      type: object
      description: >
        Provably-fair context for a round (§36). The raw server seed is
        withheld until it is rotated away and revealed.
      required: [serverSeedHash, clientSeed, nonce]
      properties:
        serverSeedHash: { type: string, description: SHA-256 of the server seed — the commitment. }
        clientSeed: { type: string }
        nonce: { type: integer }
    SeedContext:
      type: object
      required: [serverSeedHash, clientSeed, nonce]
      properties:
        serverSeedHash: { type: string }
        clientSeed: { type: string }
        nonce: { type: integer, description: Nonce the next round will consume. }
    DebugState:
      type: object
      required: [forcedOutcome, simulation]
      properties:
        forcedOutcome:
          type: object
          description: Only the forced fields are present; {} means nothing is forced.
          properties:
            depth: { type: string }
            fish: { type: string }
            tier: { type: string }
        simulation:
          type: object
          required: [latencyMs, errorRate]
          properties:
            latencyMs: { type: number, example: 0 }
            errorRate: { type: number, example: 0 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The sessionToken returned by POST /api/session.
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, example: invalid_session }
                  message: { type: string }
