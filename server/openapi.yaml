openapi: 3.0.3
info:
  title: Deep Catch — Mock Game Server
  version: 0.0.0
  description: >
    Development game server. Server-authoritative for sessions, balances, RNG,
    outcomes and payouts. Only the endpoints implemented at the current milestone
    are listed here.
servers:
  - url: http://127.0.0.1:3001

tags:
  - name: health
  - name: session
  - name: game
  - name: operator

paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number, example: 12.34 }

  /api/session:
    post:
      tags: [session]
      summary: Create a session (unauthenticated)
      description: >
        Performs a real HMAC-SHA256-signed round-trip to POST /operator/launch,
        then mints a session token bound to a fresh development wallet.
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, playerId, currency, balance]
                properties:
                  sessionToken: { type: string, format: uuid }
                  playerId: { type: string, example: dev-player-1 }
                  currency: { type: string, example: USD }
                  balance:
                    type: string
                    description: Decimal string, never a float.
                    example: "1000.00"
        "502":
          $ref: "#/components/responses/Error"

  /api/game/balance:
    get:
      tags: [game]
      summary: Authoritative live balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency]
                properties:
                  balance: { type: string, example: "1000.00" }
                  currency: { type: string, example: USD }
        "401":
          $ref: "#/components/responses/Error"

  /api/game/current:
    post:
      tags: [game]
      summary: Balance plus any in-progress round to resume
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency, active]
                properties:
                  balance: { type: string, example: "1000.00" }
                  currency: { type: string, example: USD }
                  active:
                    type: boolean
                    description: True when a round is open and resumable.
                  roundId: { type: string }
        "401":
          $ref: "#/components/responses/Error"

  /operator/launch:
    post:
      tags: [operator]
      summary: Operator side of the launch handshake (internal)
      description: >
        Called by POST /api/session over real HTTP. Requires the X-Operator-ID,
        X-Timestamp and X-HMAC-SHA256 headers. Not called directly by the client.
      parameters:
        - in: header
          name: X-Operator-ID
          required: true
          schema: { type: string }
        - in: header
          name: X-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: X-HMAC-SHA256
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        "200":
          description: Launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId: { type: string }
                  launched: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The sessionToken returned by POST /api/session.
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, example: invalid_session }
                  message: { type: string }
